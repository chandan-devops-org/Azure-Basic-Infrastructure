name: Test OIDC and Validate Terraform

on:
  push:
    branches:
      - 'feature/azure-test' # Scoped strictly to your automated feature branch runs

permissions:
  id-token: write # Mandated by Azure OIDC
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    environment: learning # Maps to your repository environment
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # New Step: Installs the secure Terraform CLI runtime environment on the runner engine
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.9.0" # Clean, locked standard production version

    # New Step: Validates formatting syntax spaces across your new .tf files
    - name: Terraform Format Check
      run: terraform fmt -check

    # New Step: Initializes providers locally inside the virtual workspace
    - name: Terraform Init
      run: terraform init -backend=false # Sets false to bypass cloud storage checks during local feature testing

    # New Step: Executes a complete code integrity validation scan
    - name: Terraform Validate
      run: terraform validate

    - name: Connect to Azure via OIDC
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    # 🚀 NEW STEP: Generates a detailed preview of your cloud changes
    - name: Terraform Plan
      run: terraform plan
